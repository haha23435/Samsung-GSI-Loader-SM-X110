name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Sign APK
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -n 1)/android.jar

          mkdir -p build/gen build/obj build/dex build/apk

          $BUILD_TOOLS/aapt2 compile --dir res -o build/res.zip
          $BUILD_TOOLS/aapt2 link -I "$PLATFORM" \
            --manifest AndroidManifest.xml \
            -A assets \
            --java build/gen \
            -o build/apk/unaligned.apk \
            build/res.zip

          find src build/gen -name "*.java" > build/sources.txt
          javac --release 8 -cp "$PLATFORM" -d build/obj @build/sources.txt

          $BUILD_TOOLS/d8 --lib "$PLATFORM" --output build/dex $(find build/obj -name "*.class")
          zip -uj build/apk/unaligned.apk build/dex/classes.dex

          $BUILD_TOOLS/zipalign -f 4 build/apk/unaligned.apk build/apk/aligned.apk
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android \
            --out Samsung-GSI-Loader-SM-X110.apk build/apk/aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-GSI-Loader-SM-X110
          path: Samsung-GSI-Loader-SM-X110.apk
